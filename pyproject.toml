[project]
name = "etl-pipeline"
version = "1.0.0"
description = "Multi-agent ETL pipeline with a Streamlit dashboard, run history and a guarded SQL explorer"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.63.0",
    "pandas>=3.0.5",
    "numpy>=2.5.2; python_version >= '3.12'",
    "numpy>=1.24.0,<2.5.0; python_version < '3.12'",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.13.4",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "faker>=40.38.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is handled by the formatter
# B008: FastAPI's Depends()/File() default-argument idiom is intentional
ignore = ["E501", "B008"]
